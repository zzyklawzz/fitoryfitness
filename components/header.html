<!-- ===================================== -->
<!-- MENU STYLES -->
<!-- ===================================== -->

<style>

    /* ===================================== */
    /* MENU LINK BASE */
    /* ===================================== */

    #mobile-menu .menu-nav-link {

        position: relative;

        color: #ffffff;

        transition:
            color 0.25s ease;

    }


    /* ===================================== */
    /* SHORT ORANGE UNDERLINE */
    /* ===================================== */

    #mobile-menu .menu-nav-link::after {

        content: "";

        position: absolute;

        left: 0;

        bottom: 8px;

        width: 0;

        height: 2px;

        background: #f97316;

        transition:
            width 0.25s ease;

    }


    /* ===================================== */
    /* HOVER STATE */
    /* ===================================== */

    #mobile-menu .menu-nav-link:hover {

        color: #f97316;

    }


    #mobile-menu .menu-nav-link:hover::after {

        width: 65%;

    }


    /* ===================================== */
    /* ACTIVE PAGE */
    /* ===================================== */

    #mobile-menu .menu-nav-link.active {

        color: #f97316;

    }


    #mobile-menu .menu-nav-link.active::after {

        width: 65%;

    }

</style>
